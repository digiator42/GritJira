[package]
name = "test"
version = "0.1.0"
edition = "2024"

[dependencies]
gritshield = { path = "../GritShield", features = [
    "postgres",
    "admin",
    "swagger",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1.1", default-features = false, features = [
    "runtime-tokio-native-tls",
    "macros",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
] }
ctor = "1.0.7"
validator = "0.20.0"
serde-aux = "4.5"
